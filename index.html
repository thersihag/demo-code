<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Group Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800 h-screen overflow-hidden flex items-center justify-center">
    
    <!-- Toast -->
    <div id="toast" class="fixed top-4 right-4 bg-green-600 text-white px-6 py-3 rounded-xl shadow-lg transform transition-transform translate-x-full duration-300 z-50 flex items-center gap-2">
        <i class="fas fa-check-circle"></i>
        <span id="toast-text">Copied!</span>
    </div>

    <!-- Auth Section -->
    <div id="auth-section" class="max-w-xl w-full bg-white p-8 rounded-2xl shadow-xl border border-gray-100 text-center">
        <h1 class="text-4xl font-bold mb-6 text-green-600">WhatsApp Extractor</h1>
        <h2 id="status-text" class="text-lg font-semibold text-gray-700 mb-6 bg-gray-100 px-6 py-3 rounded-full inline-block">
            Initializing...
        </h2>
        
        <div id="qr-container" class="hidden">
            <p class="text-sm text-gray-500 mb-4">Scan this QR with your WhatsApp</p>
            <img id="qr-image" src="" alt="QR Code" class="mx-auto w-72 h-72 border-4 border-gray-200 rounded-2xl shadow-md">
        </div>
    </div>

    <!-- Main UI -->
    <div id="main-ui" class="hidden w-full h-full flex">
        <!-- Left: Groups -->
        <div class="w-1/3 bg-white border-r border-gray-200 flex flex-col h-full">
            <div class="p-5 border-b bg-gray-50 flex justify-between items-center">
                <h2 class="text-2xl font-bold">Your Groups</h2>
                <span id="group-count" class="bg-green-100 text-green-700 text-sm font-bold px-3 py-1 rounded-full">0</span>
            </div>
            
            <div id="loading-groups" class="text-center py-8 text-gray-500 hidden">Fetching your groups...</div>
            
            <div id="groups-list" class="overflow-y-auto flex-1 p-3 space-y-2">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Right: Members -->
        <div class="w-2/3 bg-gray-50 flex flex-col h-full">
            <div id="right-empty" class="flex-1 flex flex-col items-center justify-center text-gray-400">
                <i class="fas fa-users text-6xl mb-4 text-gray-300"></i>
                <p class="text-xl">Select a group to view members</p>
            </div>

            <div id="right-content" class="hidden flex-col h-full">
                <div class="p-5 border-b bg-white flex justify-between items-center">
                    <div>
                        <h2 id="selected-group-name" class="text-2xl font-bold">Group Name</h2>
                        <p id="selected-group-count" class="text-gray-500">0 Participants</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="copyCurrentMembers()" 
                                class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl flex items-center gap-2 transition">
                            <i class="fas fa-copy"></i> Copy Numbers
                        </button>
                        <a id="download-csv-btn" href="#" 
                           class="px-5 py-2.5 bg-green-600 hover:bg-green-700 text-white font-medium rounded-xl flex items-center gap-2 transition">
                            <i class="fas fa-download"></i> Download CSV
                        </a>
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto p-6">
                    <ul id="members-list" class="bg-white rounded-2xl shadow-sm divide-y">
                        <!-- Members populated here -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentMembers = [];
        let isConnected = false;

        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                const statusText = document.getElementById('status-text');
                const qrContainer = document.getElementById('qr-container');
                const qrImage = document.getElementById('qr-image');
                const authSection = document.getElementById('auth-section');
                const mainUi = document.getElementById('main-ui');

                if (data.status === 'DISCONNECTED' && data.qr) {
                    statusText.innerText = 'Scan QR Code to Login';
                    statusText.className = 'text-lg font-semibold text-yellow-600 mb-6 bg-yellow-50 px-6 py-3 rounded-full inline-block';
                    qrImage.src = data.qr;
                    qrContainer.classList.remove('hidden');
                    setTimeout(checkStatus, 3000);
                } else if (data.status === 'CONNECTED') {
                    if (!isConnected) {
                        isConnected = true;
                        document.body.classList.remove('items-center', 'justify-center');
                        authSection.classList.add('hidden');
                        mainUi.classList.remove('hidden');
                        loadGroups();
                    }
                } else {
                    setTimeout(checkStatus, 3000);
                }
            } catch (e) {
                setTimeout(checkStatus, 3000);
            }
        }

        async function loadGroups() {
            document.getElementById('loading-groups').classList.remove('hidden');
            try {
                const res = await fetch('/api/groups');
                const groups = await res.json();

                document.getElementById('group-count').innerText = groups.length;
                const list = document.getElementById('groups-list');
                list.innerHTML = '';

                groups.forEach(group => {
                    const div = document.createElement('div');
                    div.className = 'p-4 bg-white border border-gray-100 rounded-xl hover:border-green-300 cursor-pointer transition-all';
                    div.onclick = () => selectGroup(group.id, group.subject);
                    div.innerHTML = `
                        <h3 class="font-semibold text-gray-800">${group.subject}</h3>
                        <p class="text-sm text-gray-500 mt-1">${group.size} participants</p>
                    `;
                    list.appendChild(div);
                });
            } catch (e) {
                console.error(e);
            }
            document.getElementById('loading-groups').classList.add('hidden');
        }

        async function selectGroup(groupId, groupName) {
            document.getElementById('right-empty').classList.add('hidden');
            document.getElementById('right-content').classList.remove('hidden');

            document.getElementById('selected-group-name').innerText = groupName;
            document.getElementById('members-list').innerHTML = '<li class="p-8 text-center text-gray-500">Loading members...</li>';

            document.getElementById('download-csv-btn').href = `/api/groups/${groupId}/csv`;

            try {
                const res = await fetch(`/api/groups/${groupId}/members`);
                const members = await res.json();
                currentMembers = members;

                document.getElementById('selected-group-count').innerText = `${members.length} Participants`;

                const list = document.getElementById('members-list');
                list.innerHTML = '';

                members.forEach(m => {
                    const li = document.createElement('li');
                    li.className = 'p-4 flex justify-between items-center hover:bg-gray-50';
                    li.innerHTML = `
                        <span class="font-mono text-gray-800">${m.id}</span>
                        ${m.isAdmin ? '<span class="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-medium">Admin</span>' : ''}
                    `;
                    list.appendChild(li);
                });
            } catch (e) {
                document.getElementById('members-list').innerHTML = '<li class="p-8 text-center text-red-500">Failed to load members</li>';
            }
        }

        function copyCurrentMembers() {
            if (!currentMembers.length) return;
            const text = currentMembers.map(m => m.id).join('\n');
            navigator.clipboard.writeText(text).then(() => {
                showToast(`✅ Copied ${currentMembers.length} numbers!`);
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerHTML = message;
            toast.classList.remove('translate-x-full');
            setTimeout(() => toast.classList.add('translate-x-full'), 3000);
        }

        // Start polling
        checkStatus();
    </script>
</body>
</html>
